<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c4cf1"><title>TafelBingo</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="brand"><div><h1>✦ TafelBingo</h1><p>Voorspel wat er gezegd wordt</p></div><button id="newGame">＋ Nieuwe bingo</button></header>
<section id="home"><div class="intro"><h2>Mijn bingo’s</h2><p>Bewaar meerdere bingo’s en speel ze door elkaar.</p></div><div id="games" class="game-grid"></div></section>
<section id="editor" class="panel hidden"><div class="topline"><button id="editorBack" class="ghost">← Overzicht</button><h2 id="editorHeading">Nieuwe bingo</h2></div><label>Naam van het spel</label><input id="title" placeholder="Bijvoorbeeld: Familiefeest"><label>Onderwerp</label><input id="topic" placeholder="Bijvoorbeeld: De verbouwing"><label>Woord of zin</label><textarea id="entry" placeholder="Geen tekenlimiet"></textarea><button id="add" class="secondary wide">＋ Voeg voorspelling toe</button><div id="drafts"></div><p id="count"></p><button id="saveGame" class="wide">Bewaar bingo</button><button id="start" class="wide accent">Bewaar en speel 🎉</button></section>
<section id="play" class="hidden"><div class="gamehead"><div><h2 id="gameTitle"></h2><p id="gameTopic"></p></div><strong id="score"></strong><div class="bar"><i id="progress"></i></div></div><div class="tools"><button id="playBack" class="ghost">← Overzicht</button><button id="editGame" class="secondary">✏️ Beheren</button><button id="share">↗ Delen</button><button id="reset" class="danger">↻ Opnieuw</button></div><div id="cards" class="cards"></div><button id="quickAdd" class="float">＋</button></section></main>
<dialog id="dialog"><h3 id="dialogTitle"></h3><textarea id="dialogText"></textarea><div class="tools"><button id="cancel" class="ghost">Annuleren</button><button id="save">Opslaan</button></div></dialog><div id="bingo" class="overlay hidden"><div><b>🎉</b><h2>BINGO!</h2><p id="bingoText"></p><button id="closeBingo">Verder kijken</button><button id="shareBingo" class="secondary">Deel via WhatsApp</button></div></div><script src="app.js"></script></body></html>
