<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c4cf1"><title>TafelBingo</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><h1>✦ TafelBingo</h1><p>Voorspel wat er gezegd wordt</p></header><section id="setup" class="panel"><h2>Wat hoor jij straks? 👀</h2><input id="title" placeholder="Naam van het spel"><input id="topic" placeholder="Onderwerp"><textarea id="entry" placeholder="Woord of volledige zin, zonder tekenlimiet"></textarea><button id="add" class="secondary">＋ Voeg voorspelling toe</button><div id="drafts"></div><p id="count"></p><button id="start">Start de bingo 🎉</button></section><section id="game" class="hidden"><div class="gamehead"><h2 id="gameTitle"></h2><p id="gameTopic"></p><strong id="score"></strong><div class="bar"><i id="progress"></i></div></div><div class="tools"><button id="back">← Beheren</button><button id="share">Deel via WhatsApp</button><button id="reset">Opnieuw</button></div><div id="cards"></div><button id="quickAdd" class="float">＋</button></section></main><dialog id="dialog"><h3 id="dialogTitle"></h3><textarea id="dialogText"></textarea><div class="tools"><button id="cancel">Annuleren</button><button id="save">Opslaan</button></div></dialog><div id="bingo" class="overlay hidden"><div><b>🎉</b><h2>BINGO!</h2><p id="bingoText"></p><button id="closeBingo">Verder kijken</button><button id="shareBingo" class="secondary">Deel via WhatsApp</button></div></div><script src="app.js"></script></body></html>
